<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AU Video Watch Dashboard</title>
<style>
  :root{
    --ink:#0d0f14; --panel:#14171f; --panel-2:#1b1f2a; --line:#262b38; --line-2:#333a4b;
    --steel:#8a94a6; --steel-dim:#5b6474; --paper:#e8ebf2;
    --amber:#f4b942; --teal:#3fb9a3; --danger:#ff5a52;
    --mono:ui-monospace,"SF Mono","JetBrains Mono",Menlo,Consolas,monospace;
    --sans:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--ink);color:var(--paper);font-family:var(--sans);-webkit-font-smoothing:antialiased}
  .wrap{max-width:1400px;margin:0 auto;padding:22px}
  .kicker{font-family:var(--mono);font-size:10px;letter-spacing:.28em;text-transform:uppercase;color:var(--steel-dim)}
  h1{font-size:22px;margin:4px 0 4px;letter-spacing:-.01em}
  .sub{color:var(--steel-dim);font-size:12px;margin-bottom:18px;font-family:var(--mono)}
  .controls{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:18px}
  .ctrl-row{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:10px}
  .ctrl-row:last-child{margin-bottom:0}
  .ctrl-row label{font-family:var(--mono);font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--steel);margin-right:4px;min-width:85px}
  .seg{display:inline-flex;background:var(--panel-2);border:1px solid var(--line-2);border-radius:8px;overflow:hidden}
  .seg button{background:transparent;border:0;color:var(--steel);padding:7px 12px;font-family:var(--mono);font-size:12px;cursor:pointer;transition:all .15s}
  .seg button:hover{color:var(--paper)}
  .seg button.active{background:var(--amber);color:#111}
  input[type=text],input[type=date],select{background:var(--panel-2);border:1px solid var(--line-2);color:var(--paper);padding:7px 10px;border-radius:7px;font-size:13px;outline:none;font-family:var(--sans)}
  input[type=text]{width:280px}
  input:focus,select:focus{border-color:var(--amber);box-shadow:0 0 0 3px rgba(244,185,66,.12)}
  .pill{display:inline-flex;align-items:center;gap:6px;background:var(--panel-2);border:1px solid var(--line-2);border-radius:20px;padding:5px 11px;font-size:12px;cursor:pointer;user-select:none;transition:all .15s}
  .pill:hover{border-color:var(--amber)}
  .pill input{margin:0;accent-color:var(--amber);cursor:pointer}
  .table-box{background:var(--panel);border:1px solid var(--line);border-radius:12px;overflow:hidden;margin-bottom:18px}
  .table-head{padding:12px 16px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px}
  .table-head h2{margin:0;font-size:14px;font-weight:600}
  .table-head .count{font-family:var(--mono);font-size:11px;color:var(--steel-dim);margin-left:auto}
  table{width:100%;border-collapse:collapse;font-size:13px}
  thead th{text-align:left;padding:11px 14px;background:var(--panel-2);font-family:var(--mono);font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--steel-dim);font-weight:500;cursor:pointer;user-select:none;border-bottom:1px solid var(--line);transition:color .15s}
  thead th:hover{color:var(--paper)}
  thead th.nosort{cursor:default}
  thead th.nosort:hover{color:var(--steel-dim)}
  thead th .arrow{color:var(--amber);margin-left:4px}
  tbody td{padding:10px 14px;border-bottom:1px solid var(--line);vertical-align:top}
  tbody tr:hover{background:var(--panel-2)}
  tbody tr:last-child td{border-bottom:0}
  td.id{font-family:var(--mono);font-size:12px;color:var(--amber)}
  td.wt{font-family:var(--mono);text-align:right;color:var(--teal);font-weight:500}
  .empty{padding:50px;text-align:center;color:var(--steel-dim);font-size:13px}
  .pager{display:flex;align-items:center;justify-content:center;gap:12px;padding:12px;border-top:1px solid var(--line)}
  .pager button{background:var(--panel-2);border:1px solid var(--line-2);color:var(--paper);padding:6px 14px;border-radius:7px;cursor:pointer;font-family:var(--mono);font-size:12px;transition:all .15s}
  .pager button:hover:not(:disabled){border-color:var(--amber)}
  .pager button:disabled{opacity:.3;cursor:not-allowed}
  .pager .info{font-family:var(--mono);font-size:11px;color:var(--steel-dim)}
  .err{color:var(--danger);font-family:var(--mono);font-size:12px;background:#2a1416;padding:12px 14px;border-radius:9px;margin-bottom:14px;border:1px solid var(--danger)}
</style>
</head>
<body>
<div class="wrap">
  <div class="kicker">Amar Ujala · Reader Revenue</div>
  <h1>Video Watch Time Dashboard</h1>
  <p class="sub" id="dataInfo">Loading data…</p>

  <div id="err"></div>

  <div class="controls">
    <div class="ctrl-row">
      <label>Date range</label>
      <div class="seg" id="dateSeg">
        <button data-range="7">Last 7 days</button>
        <button data-range="1">Yesterday</button>
        <button data-range="daily">Daily (pick)</button>
        <button data-range="custom">Custom</button>
      </div>
      <span id="dateExtra"></span>
    </div>
    <div class="ctrl-row">
      <label>Search in</label>
      <div class="seg" id="searchFieldSeg">
        <button data-field="video_title" class="active">Title</button>
        <button data-field="video_id">Video ID</button>
      </div>
      <input type="text" id="searchBox" placeholder="type to filter…">
    </div>
    <div class="ctrl-row">
      <label>Columns</label>
      <span class="pill"><input type="checkbox" id="col_video_title" checked> Video Title</span>
      <span class="pill"><input type="checkbox" id="col_video_id" checked> Video ID</span>
      <span class="pill" style="opacity:.55;cursor:not-allowed"><input type="checkbox" checked disabled> Watch Time (always)</span>
    </div>
  </div>

  <div class="table-box">
    <div class="table-head">
      <h2>📊 Google Analytics</h2>
      <span class="count" id="gaCount">—</span>
    </div>
    <div id="gaTable"></div>
    <div class="pager" id="gaPager"></div>
  </div>

  <div class="table-box">
    <div class="table-head">
      <h2>📡 CDP · Pinot (app-only clean slice)</h2>
      <span class="count" id="cdpCount">—</span>
    </div>
    <div id="cdpTable"></div>
    <div class="pager" id="cdpPager"></div>
  </div>
</div>

<script>
// ============ CONFIG — PASTE YOUR SHEET ID HERE ============
const SHEET_ID = "REPLACE_WITH_YOUR_SHEET_ID";
const GA_TAB = "GA_Daily";
const CDP_TAB = "CDP_Daily";
const PAGE_SIZE = 10;

const urlFor = tab => `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:csv&sheet=${encodeURIComponent(tab)}`;

// ============ STATE ============
const state = {
  gaRaw: [], cdpRaw: [],
  dateMode: "7", customFrom: "", customTo: "", dailyDate: "",
  searchField: "video_title", searchText: "",
  cols: {video_title:true, video_id:true},
  sort: {ga:{col:"watch_time_seconds", dir:"desc"}, cdp:{col:"watch_time_seconds", dir:"desc"}},
  page: {ga:1, cdp:1},
};

// ============ CSV PARSER ============
function parseCSV(text){
  const rows = [];
  let cur = [], val = "", inQ = false;
  for (let i=0; i<text.length; i++){
    const c = text[i];
    if (inQ){
      if (c === '"' && text[i+1] === '"'){ val += '"'; i++; }
      else if (c === '"'){ inQ = false; }
      else val += c;
    } else {
      if (c === '"') inQ = true;
      else if (c === ',') { cur.push(val); val = ""; }
      else if (c === '\n') { cur.push(val); rows.push(cur); cur = []; val = ""; }
      else if (c !== '\r') val += c;
    }
  }
  if (val || cur.length) { cur.push(val); rows.push(cur); }
  if (!rows.length) return [];
  const headers = rows[0];
  return rows.slice(1).filter(r => r.length === headers.length).map(r => {
    const o = {};
    headers.forEach((h,i) => o[h] = r[i]);
    o.watch_time_seconds = parseInt(o.watch_time_seconds || 0) || 0;
    return o;
  }).filter(r => r.video_id && r.video_title && r.watch_time_seconds > 0);  // defensive filter
}

async function loadData(){
  try {
    const [gaText, cdpText] = await Promise.all([
      fetch(urlFor(GA_TAB)).then(r => r.text()),
      fetch(urlFor(CDP_TAB)).then(r => r.text()),
    ]);
    state.gaRaw = parseCSV(gaText);
    state.cdpRaw = parseCSV(cdpText);
    const allDates = [...new Set([...state.gaRaw, ...state.cdpRaw].map(r => r.date))].filter(Boolean).sort();
    const latest = allDates[allDates.length-1] || "";
    const earliest = allDates[0] || "";
    document.getElementById("dataInfo").textContent =
      `Loaded ${state.gaRaw.length.toLocaleString()} GA rows · ${state.cdpRaw.length.toLocaleString()} CDP rows · ${earliest} → ${latest}`;
    state.dailyDate = latest;
    state.customFrom = earliest;
    state.customTo = latest;
    render();
  } catch (e) {
    document.getElementById("err").innerHTML =
      `<div class="err">❌ Failed to load sheet. Make sure the sheet is shared as "Anyone with link can view" and SHEET_ID is correct. Error: ${e.message}</div>`;
  }
}

function allDates(){
  return [...new Set([...state.gaRaw, ...state.cdpRaw].map(r => r.date))].filter(Boolean).sort();
}
function dateWindow(){
  const ds = allDates();
  if (!ds.length) return new Set();
  const latest = ds[ds.length-1];
  if (state.dateMode === "7"){
    const d = new Date(latest); d.setDate(d.getDate()-6);
    const from = d.toISOString().slice(0,10);
    return new Set(ds.filter(x => x >= from && x <= latest));
  }
  if (state.dateMode === "1") return new Set([latest]);
  if (state.dateMode === "daily") return new Set([state.dailyDate]);
  if (state.dateMode === "custom") return new Set(ds.filter(x => x >= state.customFrom && x <= state.customTo));
  return new Set(ds);
}

function processed(raw){
  const dates = dateWindow();
  const cols = state.cols;
  if (!cols.video_title && !cols.video_id){
    cols.video_title = true;
    document.getElementById("col_video_title").checked = true;
  }
  let rows = raw.filter(r => dates.has(r.date));
  if (state.searchText){
    const q = state.searchText.toLowerCase();
    rows = rows.filter(r => (r[state.searchField] || "").toLowerCase().includes(q));
  }
  const keyFn = r => [cols.video_title ? r.video_title : "", cols.video_id ? r.video_id : ""].join("||");
  const agg = {};
  for (const r of rows){
    const k = keyFn(r);
    if (!agg[k]) agg[k] = {video_title:r.video_title, video_id:r.video_id, watch_time_seconds:0};
    agg[k].watch_time_seconds += r.watch_time_seconds;
  }
  return Object.values(agg);
}

function sortRows(rows, srt){
  const {col, dir} = srt;
  const mul = dir === "asc" ? 1 : -1;
  return rows.slice().sort((a,b) => {
    const av = a[col], bv = b[col];
    if (typeof av === "number") return (av - bv) * mul;
    return String(av || "").localeCompare(String(bv || ""), "en", {numeric:true}) * mul;
  });
}

function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[m]));}

function renderTable(which, containerId, pagerId, countId){
  const raw = which === "ga" ? state.gaRaw : state.cdpRaw;
  const rows = sortRows(processed(raw), state.sort[which]);
  const page = state.page[which];
  const totalPages = Math.max(1, Math.ceil(rows.length / PAGE_SIZE));
  const start = (page - 1) * PAGE_SIZE;
  const pageRows = rows.slice(start, start + PAGE_SIZE);

  const cols = state.cols;
  const srt = state.sort[which];
  const arrow = c => srt.col === c ? `<span class="arrow">${srt.dir === "asc" ? "↑" : "↓"}</span>` : "";

  let visibleCols = 0;
  let html = `<table><thead><tr>`;
  if (cols.video_title){ html += `<th data-col="video_title" data-which="${which}">Video Title${arrow("video_title")}</th>`; visibleCols++; }
  if (cols.video_id){    html += `<th class="nosort">Video ID</th>`; visibleCols++; }
  html += `<th data-col="watch_time_seconds" data-which="${which}" style="text-align:right">Watch Time (sec)${arrow("watch_time_seconds")}</th>`;
  visibleCols++;
  html += `</tr></thead><tbody>`;

  if (!pageRows.length){
    html += `<tr><td colspan="${visibleCols}" class="empty">No matching data for this filter.</td></tr>`;
  } else {
    for (const r of pageRows){
      html += `<tr>`;
      if (cols.video_title) html += `<td>${esc(r.video_title || "—")}</td>`;
      if (cols.video_id)    html += `<td class="id">${esc(r.video_id || "—")}</td>`;
      html += `<td class="wt">${r.watch_time_seconds.toLocaleString()}</td>`;
      html += `</tr>`;
    }
  }
  html += `</tbody></table>`;
  document.getElementById(containerId).innerHTML = html;
  const totalWt = rows.reduce((s,r) => s+r.watch_time_seconds, 0);
  document.getElementById(countId).textContent = `${rows.length.toLocaleString()} rows · total ${totalWt.toLocaleString()} sec`;
  document.getElementById(pagerId).innerHTML = `
    <button ${page<=1?"disabled":""} data-pg="prev" data-w="${which}">‹ Prev</button>
    <span class="info">Page ${page} of ${totalPages}</span>
    <button ${page>=totalPages?"disabled":""} data-pg="next" data-w="${which}">Next ›</button>
  `;
}

function render(){
  const extra = document.getElementById("dateExtra");
  if (state.dateMode === "daily"){
    const ds = allDates();
    extra.innerHTML = `<select id="dailyPick">${ds.map(d => `<option value="${d}" ${d===state.dailyDate?"selected":""}>${d}</option>`).join("")}</select>`;
    document.getElementById("dailyPick").onchange = e => { state.dailyDate = e.target.value; state.page.ga=1; state.page.cdp=1; render(); };
  } else if (state.dateMode === "custom"){
    extra.innerHTML = `<input type="date" id="customFrom" value="${state.customFrom}"> <span style="color:var(--steel-dim);font-family:var(--mono);font-size:11px">to</span> <input type="date" id="customTo" value="${state.customTo}">`;
    document.getElementById("customFrom").onchange = e => { state.customFrom = e.target.value; state.page.ga=1; state.page.cdp=1; render(); };
    document.getElementById("customTo").onchange = e => { state.customTo = e.target.value; state.page.ga=1; state.page.cdp=1; render(); };
  } else { extra.innerHTML = ""; }

  renderTable("ga", "gaTable", "gaPager", "gaCount");
  renderTable("cdp", "cdpTable", "cdpPager", "cdpCount");
}

document.getElementById("dateSeg").addEventListener("click", e => {
  if (e.target.tagName !== "BUTTON") return;
  document.querySelectorAll("#dateSeg button").forEach(b => b.classList.remove("active"));
  e.target.classList.add("active");
  state.dateMode = e.target.dataset.range;
  state.page.ga = 1; state.page.cdp = 1;
  render();
});
document.getElementById("searchFieldSeg").addEventListener("click", e => {
  if (e.target.tagName !== "BUTTON") return;
  document.querySelectorAll("#searchFieldSeg button").forEach(b => b.classList.remove("active"));
  e.target.classList.add("active");
  state.searchField = e.target.dataset.field;
  render();
});
document.getElementById("searchBox").addEventListener("input", e => {
  state.searchText = e.target.value.trim();
  state.page.ga = 1; state.page.cdp = 1;
  render();
});
["col_video_title","col_video_id"].forEach(id => {
  document.getElementById(id).addEventListener("change", e => {
    state.cols[id.replace("col_","")] = e.target.checked;
    state.page.ga = 1; state.page.cdp = 1;
    render();
  });
});
document.body.addEventListener("click", e => {
  const th = e.target.closest("th[data-col]");
  if (th){
    const w = th.dataset.which, c = th.dataset.col;
    if (state.sort[w].col === c) state.sort[w].dir = state.sort[w].dir === "asc" ? "desc" : "asc";
    else { state.sort[w].col = c; state.sort[w].dir = "desc"; }
    render();
    return;
  }
  const pg = e.target.closest("button[data-pg]");
  if (pg){
    const w = pg.dataset.w;
    state.page[w] += (pg.dataset.pg === "next" ? 1 : -1);
    render();
  }
});

document.querySelector('#dateSeg button[data-range="7"]').classList.add("active");
loadData();
</script>
</body>
</html>
