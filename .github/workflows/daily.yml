name: Daily video data sync

on:
  schedule:
    - cron: '30 0 * * *'   # 6:00 AM IST = 00:30 UTC
  workflow_dispatch:
    inputs:
      backfill_dates:
        description: 'Comma-separated dates (YYYY-MM-DD) for backfill. Leave empty for daily mode.'
        required: false
        default: ''

jobs:
  sync:
    runs-on: ubuntu-latest
    env:
      GCP_SERVICE_ACCOUNT_JSON: ${{ secrets.GCP_SERVICE_ACCOUNT_JSON }}
      SHEET_ID: ${{ secrets.SHEET_ID }}
      PINOT_PASSWORD: ${{ secrets.PINOT_PASSWORD }}
      BACKFILL_DATES: ${{ github.event.inputs.backfill_dates }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Fetch GA4
        run: python fetch_ga.py
      - name: Fetch Pinot
        run: python fetch_pinot.py
